# Every container that reads Umami's own connection (umami and the bridge's
# query API) must point at a Secret key that Secret actually holds. The chart's
# own Secret only ever writes DATABASE_URL, so database.existingSecretKey may
# name a key inside the user's database.existingSecret only. The umbrella
# presets that key to UMAMI_DATABASE_URL for overlays sharing ai-studio-secrets;
# installs that let the chart own the URL must keep reading DATABASE_URL.
#
# Regression guarded: #37 added the bridge's read with the key applied to the
# chart's own Secret, after #35 had fixed the umami container, so the preset
# would have left the bridge on a missing key (CreateContainerConfigError).
#
# containers[0] is umami and containers[1] the bridge (asserted per case);
# helm-unittest cannot filter by container name and env name in one path.
suite: DATABASE_URL Secret reference (umami + bridge)
release:
  name: genesis
  namespace: genesis
set:
  enabled: true
  bridge.enabled: true
tests:
  # --- chart-owned Secret: the key is always DATABASE_URL -------------------
  - it: reads DATABASE_URL from the chart Secret in both containers (external url)
    set:
      database.bundled: false
      database.external.url: "postgresql://u:p@db.example.test:5432/umami"
    asserts:
      - template: templates/secret.yaml
        exists:
          path: stringData.DATABASE_URL
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].name
          value: umami
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[1].name
          value: bridge
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: genesis-genesis-umami, key: DATABASE_URL}
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[1].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: genesis-genesis-umami, key: DATABASE_URL}

  - it: ignores the umbrella preset UMAMI_DATABASE_URL in both containers when the chart owns the URL (external url)
    set:
      database.bundled: false
      database.external.url: "postgresql://u:p@db.example.test:5432/umami"
      database.existingSecretKey: UMAMI_DATABASE_URL
    asserts:
      - template: templates/secret.yaml
        exists:
          path: stringData.DATABASE_URL
      - template: templates/secret.yaml
        notExists:
          path: stringData.UMAMI_DATABASE_URL
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: genesis-genesis-umami, key: DATABASE_URL}
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[1].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: genesis-genesis-umami, key: DATABASE_URL}

  - it: ignores the umbrella preset in both containers on the bundled database
    set:
      database.existingSecretKey: UMAMI_DATABASE_URL
    asserts:
      - template: templates/secret.yaml
        exists:
          path: stringData.DATABASE_URL
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: genesis-genesis-umami, key: DATABASE_URL}
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[1].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: genesis-genesis-umami, key: DATABASE_URL}

  - it: ignores the umbrella preset in both containers under managed identity
    set:
      database.bundled: false
      database.authMethod: managed-identity
      database.external.host: customer-pg.postgres.database.azure.com
      database.external.user: umami-identity
      database.existingSecretKey: UMAMI_DATABASE_URL
    asserts:
      - template: templates/secret.yaml
        exists:
          path: stringData.DATABASE_URL
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: genesis-genesis-umami, key: DATABASE_URL}
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[1].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: genesis-genesis-umami, key: DATABASE_URL}

  # --- user-supplied Secret: the key comes from existingSecretKey -----------
  - it: reads the default DATABASE_URL key from the user's Secret in both containers
    set:
      database.bundled: false
      database.existingSecret: umami-db
    asserts:
      - template: templates/secret.yaml
        notExists:
          path: stringData.DATABASE_URL
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: umami-db, key: DATABASE_URL}
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[1].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: umami-db, key: DATABASE_URL}

  - it: reads a custom existingSecretKey from the user's Secret in both containers
    set:
      database.bundled: false
      database.existingSecret: umami-db
      database.existingSecretKey: CUSTOM_DATABASE_URL
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: umami-db, key: CUSTOM_DATABASE_URL}
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[1].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: umami-db, key: CUSTOM_DATABASE_URL}

  - it: reads the umbrella preset UMAMI_DATABASE_URL from a shared platform Secret in both containers
    set:
      database.bundled: false
      database.existingSecret: ai-studio-secrets
      database.existingSecretKey: UMAMI_DATABASE_URL
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: ai-studio-secrets, key: UMAMI_DATABASE_URL}
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[1].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: ai-studio-secrets, key: UMAMI_DATABASE_URL}

  # --- the bridge's dedicated query role keeps its own contract -------------
  - it: leaves a dedicated bridge query role untouched by the database key preset
    set:
      database.bundled: false
      database.external.url: "postgresql://u:p@db.example.test:5432/umami"
      database.existingSecretKey: UMAMI_DATABASE_URL
      bridge.query.database.existingSecret: umami-readonly-db
    asserts:
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[1].env[?(@.name=="BRIDGE_QUERY_DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: umami-readonly-db, key: DATABASE_URL}
      - template: templates/deployment.yaml
        notExists:
          path: spec.template.spec.containers[1].env[?(@.name=="DATABASE_URL")]
      - template: templates/deployment.yaml
        equal:
          path: spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].valueFrom.secretKeyRef
          value: {name: genesis-genesis-umami, key: DATABASE_URL}
