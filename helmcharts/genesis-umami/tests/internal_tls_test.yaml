suite: genesis-umami internal TLS
release:
  name: genesis
  namespace: genesis
templates:
  - templates/deployment.yaml
  - templates/staff-setup-job.yaml
  - templates/service.yaml
set:
  enabled: true
  bridge:
    enabled: true
    routeRegistration:
      enabled: true
      url: "https://genesis-authz:8000"
  staffSetup:
    enabled: true
  keycloak:
    setup:
      enabled: true
      url: "https://genesis-idp:8443/auth"
  redis:
    enabled: true
    tls: true
    host: redis.example
    caCert:
      secretName: redis-ca-secret
  database:
    existingSecret: dbsec
  app:
    existingSecret: appsec
tests:
  # --- Off (the default): the switch leaves no trace; these pin the pieces a regression would most likely leak. ---
  - it: off, the bridge dials the app on plain loopback and nothing mounts the TLS Secret
    template: templates/deployment.yaml
    set:
      bridge:
        routeRegistration:
          url: "http://genesis-authz:8000"
      keycloak:
        setup:
          url: "http://genesis-idp:8080/auth"
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: UMAMI_INTERNAL_URL
            value: "http://127.0.0.1:3000"
      - notExists:
          path: spec.template.spec.initContainers
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: internal-tls
            secret:
              secretName: "genesis-internal-tls"
              defaultMode: 0440
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
      - notExists:
          path: spec.template.spec.containers[1].readinessProbe.httpGet.scheme
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_TLS_CERT
            value: /etc/genesis/internal-tls/tls.crt
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: GENESIS_TLS_CERT
            value: /etc/genesis/internal-tls/tls.crt

  - it: off, the staff-setup Job calls the app over http
    template: templates/staff-setup-job.yaml
    set:
      keycloak:
        setup:
          url: "http://genesis-idp:8080/auth"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_URL
            value: "http://genesis-genesis-umami:3000/umami"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CURL_CA_BUNDLE
            value: /etc/genesis/internal-tls/ca.crt

  # ---------------------------------------------------------------------------
  # On: TLS on BOTH umami ports. Every port stays; nothing is removed.
  # ---------------------------------------------------------------------------
  - it: on, both Service ports are kept
    template: templates/service.yaml
    set:
      global:
        internalTls:
          enabled: true
    asserts:
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].port
          value: 3000
      - equal:
          path: spec.ports[1].name
          value: bridge
      - equal:
          path: spec.ports[1].port
          value: 3001

  - it: on, the app and the bridge mount the Secret read-only and read GENESIS_TLS_*
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: internal-tls
            secret:
              secretName: "genesis-internal-tls"
              defaultMode: 0440
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: internal-tls
            mountPath: /etc/genesis/internal-tls
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: internal-tls
            mountPath: /etc/genesis/internal-tls
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENESIS_TLS_CERT
            value: /etc/genesis/internal-tls/tls.crt
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GENESIS_TLS_KEY
            value: /etc/genesis/internal-tls/tls.key

  - it: on, probes on both containers use HTTPS
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[1].readinessProbe.httpGet.scheme
          value: HTTPS
      - equal:
          path: spec.template.spec.containers[1].livenessProbe.httpGet.scheme
          value: HTTPS

  - it: on, the bridge dials the app as https://localhost (a name on the certificate), not 127.0.0.1
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: UMAMI_INTERNAL_URL
            value: "https://localhost:3000"

  - it: on with a Redis CA, the bridge trusts a merged bundle written by an init container that fails closed
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: NODE_EXTRA_CA_CERTS
            value: /etc/genesis/ca-bundle/bundle.pem
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: ca-bundle
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '\[ -s "\$f" \] \|\| \{ echo "missing or empty \$f" >&2; exit 1; \}'
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'cat /etc/genesis/internal-tls/ca.crt; echo; cat /etc/redis-ca/ca.crt'
      - equal:
          path: spec.template.spec.initContainers[0].command[1]
          value: -ec
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ca-bundle
            emptyDir:
              sizeLimit: 1Mi
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: ca-bundle
            mountPath: /etc/genesis/ca-bundle
            readOnly: true
      # The app keeps the Redis CA alone: it calls no internal TLS server.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_EXTRA_CA_CERTS
            value: /etc/redis-ca/ca.crt

  - it: on without a Redis CA, the bridge trusts ca.crt directly and there is no init container
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      redis:
        enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: NODE_EXTRA_CA_CERTS
            value: /etc/genesis/internal-tls/ca.crt
      - notExists:
          path: spec.template.spec.initContainers

  - it: on, the staff-setup Job reaches the app over https and trusts the platform internal CA in curl and node
    template: templates/staff-setup-job.yaml
    set:
      global:
        internalTls:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UMAMI_URL
            value: "https://genesis-genesis-umami:3000/umami"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CURL_CA_BUNDLE
            value: /etc/genesis/internal-tls/ca.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_EXTRA_CA_CERTS
            value: /etc/genesis/internal-tls/ca.crt
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: CURL_CA_BUNDLE
            value: /etc/genesis/internal-tls/ca.crt
      - contains:
          path: spec.template.spec.volumes
          content:
            name: internal-tls
            secret:
              secretName: "genesis-internal-tls"
              defaultMode: 0444
              items:
                - {key: ca.crt, path: ca.crt}

  - it: a custom Secret name is honoured
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
          secretName: my-tls
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: internal-tls
            secret:
              secretName: "my-tls"
              defaultMode: 0440

  # --- In-cluster http:// URLs become https:// under the switch, so turning it on needs no other values change. ---
  - it: on turns a plain-http in-cluster authz URL into https
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "http://genesis-authz:8000"
    asserts:
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "bridge")].env'
          content: {name: AUTHZ_INTERNAL_URL, value: "https://genesis-authz:8000"}
          any: true
  - it: on turns a plain-http in-cluster Keycloak setup URL into https
    template: templates/staff-setup-job.yaml
    set:
      global:
        internalTls:
          enabled: true
      keycloak:
        setup:
          url: "http://genesis-idp:8080/auth"
    asserts:
      - contains:
          path: 'spec.template.spec.initContainers[?(@.name == "keycloak-client-setup")].env'
          content: {name: KC_URL, value: "https://genesis-idp:8080/auth"}
          any: true
  # --- Only in-cluster hosts change (a bare Service name, *.svc, *.svc.cluster.local, localhost, 127.0.0.1): an
  # outside host such as a customer-hosted Keycloak keeps its URL and gets no CA, exactly as with the switch off. ---
  - it: on, an external plain-http authz and Keycloak URL still render, and are passed through untouched
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "http://authz.platform.example.com"
      keycloak:
        setup:
          url: "http://idp.example.com/auth"
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: AUTHZ_INTERNAL_URL
            value: "http://authz.platform.example.com"
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: KC_URL
            value: "http://idp.example.com/auth"
        template: templates/staff-setup-job.yaml

  - it: on, an external https Keycloak keeps curl's own trust store (no CURL_CA_BUNDLE replacing it)
    template: templates/staff-setup-job.yaml
    set:
      global:
        internalTls:
          enabled: true
      keycloak:
        setup:
          url: "https://login.example.com/auth"
    asserts:
      - notContains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: CURL_CA_BUNDLE
            value: /etc/genesis/internal-tls/ca.crt
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: KC_URL
            value: "https://login.example.com/auth"

  - it: on, an in-cluster Keycloak URL gets the platform internal CA for curl
    template: templates/staff-setup-job.yaml
    set:
      global:
        internalTls:
          enabled: true
      keycloak:
        setup:
          url: "https://genesis-idp.genesis-develop.svc:8443/auth"
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: CURL_CA_BUNDLE
            value: /etc/genesis/internal-tls/ca.crt

  - it: on, plain http to a bare Service name becomes https
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "http://genesis-authz:8000"
    asserts:
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "bridge")].env'
          content: {name: AUTHZ_INTERNAL_URL, value: "https://genesis-authz:8000"}
          any: true
  - it: on, plain http to genesis-authz.ns.svc becomes https
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "http://genesis-authz.genesis-develop.svc:8000"
    asserts:
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "bridge")].env'
          content: {name: AUTHZ_INTERNAL_URL, value: "https://genesis-authz.genesis-develop.svc:8000"}
          any: true
  - it: on, plain http to a .svc.cluster.local name becomes https
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "http://genesis-authz.genesis-develop.svc.cluster.local:8000/x"
    asserts:
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "bridge")].env'
          content: {name: AUTHZ_INTERNAL_URL, value: "https://genesis-authz.genesis-develop.svc.cluster.local:8000/x"}
          any: true
  - it: on leaves plain http to localhost as written (loopback, like genesis-lib)
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "http://localhost:8000"
    asserts:
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "bridge")].env'
          content: {name: AUTHZ_INTERNAL_URL, value: "http://localhost:8000"}
          any: true
  - it: on leaves plain http to 127.0.0.1 as written (loopback, like genesis-lib)
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "http://127.0.0.1:8000"
    asserts:
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "bridge")].env'
          content: {name: AUTHZ_INTERNAL_URL, value: "http://127.0.0.1:8000"}
          any: true
  - it: off, plain-http in-cluster URLs render exactly as before (the guard only runs with the switch on)
    template: templates/deployment.yaml
    set:
      bridge:
        routeRegistration:
          url: "http://genesis-authz:8000"
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: AUTHZ_INTERNAL_URL
            value: "http://genesis-authz:8000"

  # The leaf-rotation roll is opted in per workload, on the workload's own metadata.
  - it: switch off, the Deployment carries no reload label
    template: templates/deployment.yaml
    asserts:
      - notExists: {path: 'metadata.labels["genesis.autonomize.ai/internal-tls-reload"]'}

  - it: switch on, the Deployment is opted in to the leaf roll and its pod template is not
    template: templates/deployment.yaml
    set:
      global.internalTls.enabled: true
    asserts:
      - equal: {path: 'metadata.labels["genesis.autonomize.ai/internal-tls-reload"]', value: "true"}
      - notExists: {path: 'spec.template.metadata.labels["genesis.autonomize.ai/internal-tls-reload"]'}

  # --- global.internalTls.mountPath moves every path this chart renders, like genesis-lib. ---
  - it: on with a custom mountPath points the env, the mounts and the CA merge at it
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
          mountPath: /etc/custom-tls/
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GENESIS_TLS_CERT, value: /etc/custom-tls/tls.crt}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: internal-tls, mountPath: /etc/custom-tls, readOnly: true}
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'for f in /etc/custom-tls/ca\.crt /etc/redis-ca/ca\.crt; do'
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: /etc/genesis/internal-tls

  - it: on with a custom mountPath gives the staff setup the CA under it
    template: templates/staff-setup-job.yaml
    set:
      global:
        internalTls:
          enabled: true
          mountPath: /etc/custom-tls
    asserts:
      - contains:
          path: 'spec.template.spec.initContainers[?(@.name == "keycloak-client-setup")].volumeMounts'
          content: {name: internal-tls, mountPath: /etc/custom-tls, readOnly: true}
          any: true
      - contains:
          path: 'spec.template.spec.initContainers[?(@.name == "keycloak-client-setup")].env'
          content: {name: CURL_CA_BUNDLE, value: /etc/custom-tls/ca.crt}
          any: true
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "staff-setup")].env'
          content: {name: CURL_CA_BUNDLE, value: /etc/custom-tls/ca.crt}
          any: true
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "staff-setup")].env'
          content: {name: NODE_EXTRA_CA_CERTS, value: /etc/custom-tls/ca.crt}
          any: true

  - it: on matches the scheme and host case-insensitively
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "HTTP://GENESIS-AUTHZ.NS.SVC:8000"
    asserts:
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "bridge")].env'
          content: {name: AUTHZ_INTERNAL_URL, value: "https://GENESIS-AUTHZ.NS.SVC:8000"}
          any: true

  - it: on leaves an IPv6 literal as written (no IP in the certificate)
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "http://[fd00::10]:8000"
    asserts:
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "bridge")].env'
          content: {name: AUTHZ_INTERNAL_URL, value: "http://[fd00::10]:8000"}
          any: true

  - it: the string "false" keeps internal TLS off
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: "false"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GENESIS_TLS_CERT}
          any: true

  - it: on with an empty secretName mounts the default Secret
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
          secretName: ""
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: internal-tls
            secret: {secretName: genesis-internal-tls, defaultMode: 0440}

  - it: on gives the CA-merge init container bounded resources
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
    asserts:
      - equal:
          path: 'spec.template.spec.initContainers[?(@.name == "ca-bundle")].resources'
          value: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 50m, memory: 32Mi}}

  - it: on finds the host before any @ in the path (an in-cluster host is still rewritten)
    template: templates/deployment.yaml
    set:
      global:
        internalTls:
          enabled: true
      bridge:
        routeRegistration:
          url: "http://genesis-authz:8000/x@localhost"
    asserts:
      - contains:
          path: 'spec.template.spec.containers[?(@.name == "bridge")].env'
          content: {name: AUTHZ_INTERNAL_URL, value: "https://genesis-authz:8000/x@localhost"}
          any: true

  - it: on projects ca.crt only into the staff-setup Job, never tls.key
    template: templates/staff-setup-job.yaml
    set:
      global:
        internalTls:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: internal-tls
            secret:
              secretName: genesis-internal-tls
              defaultMode: 0444
              items:
                - {key: ca.crt, path: ca.crt}
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: internal-tls
            secret: {secretName: genesis-internal-tls, defaultMode: 0440}
