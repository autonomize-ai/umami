# =============================================================================
# genesis-umami — self-hosted Umami analytics (MIT). DEFAULT-OFF.
# =============================================================================
# Gated at the umbrella by `genesis-umami.enabled` (false by default), so this
# renders nothing unless explicitly turned on. When enabled it deploys Umami
# plus, by default, an in-chart PostgreSQL — or bring your own DB.
# =============================================================================

# Mirror of the umbrella condition so the subchart can also be used standalone.
enabled: false

replicaCount: 1

image:
  # helm-guard-exempt: built from autonomize-ai/umami — the MIT fork carrying the
  # Microsoft Entra patch — on upstream's node:22-alpine base, not Chainguard.
  # Umami is a Next.js app shipping its own Dockerfile; rebasing that onto Wolfi
  # is fork-maintenance this default-off bundle does not justify. Scoped to a
  # default-off subchart: nothing pulls it unless genesis-umami.enabled=true.
  #
  # The stock ghcr.io/umami-software/umami image CANNOT be used with
  # database.authMethod=managed-identity: it reads a static DATABASE_URL and has
  # no Entra support. That is why this is a platform-built image.
  #
  # Bare repository name, composed with global.imageRegistry like every other
  # platform image, so `--set global.imageRegistry=<customer-acr>` relocates it
  # for customer-registry-first installs.
  #
  # amd64 only. A Node/Next.js build cannot cross-compile, so an arm64 leg runs
  # under QEMU emulation — it ran >24 min without finishing and was dropped from
  # the pipeline. AKS runs amd64; local k3d on Apple Silicon builds natively.
  repository: genesis-umami
  # CI-managed: the ADO pipeline in autonomize-ai/umami writes this on every
  # build of its `develop` branch (`<upstream>-mi.<counter>`). Pinned to an exact
  # tag deliberately — `latest` would let a major bump, and its schema migration,
  # land on a restart with nobody deciding to.
  tag: "3.3.0-mi.2"
  # Optional digest pin (takes precedence over tag). Must stay empty: a digest
  # silently overrides the tag, so the pipeline's bump would become a no-op — its
  # release step refuses to run if this is set.
  digest: ""
  pullPolicy: IfNotPresent

# Pull secrets for a private registry (e.g. the org ACR mirror). Usually
# unnecessary: with the default serviceAccount settings the pod inherits
# genesis-platform-sa, which already carries them. Falls back to the platform's
# own global.serviceAccount.imagePullSecrets.{enabled,secretNames} — NOT the
# Bitnami-style global.imagePullSecrets, which no values file here sets.
# Shape is the standard [{name: my-secret}]; global uses plain secretNames.
imagePullSecrets: []

serviceAccount:
  # A ServiceAccount is REQUIRED for Azure Workload Identity: the federated
  # token is projected onto the pod's SA, and Entra trusts a specific
  # SA+namespace pair.
  #
  # create: false does NOT mean "no identity" — with `name` also empty the pod
  # inherits the platform's shared SA (global.serviceAccount.name, normally
  # genesis-platform-sa), which the umbrella already creates with the
  # workload-identity annotations and the registry pull secrets. That is how
  # every other platform service gets its identity, and it needs no Entra
  # change: the federated credential for that SA already exists.
  #
  # Set true only for a DEDICATED identity (e.g. narrower database grants) —
  # a new SA means registering a new federated credential in Entra for it.
  create: false
  # Reuse a specific existing SA instead. Empty inherits the platform's.
  name: ""
  # Extra annotations, applied to a chart-created SA. The
  # azure.workload.identity/{client-id,tenant-id} pair is added automatically
  # from global.managedIdentity — no need to repeat it.
  annotations: {}

app:
  # APP_SECRET signs Umami's auth tokens. Leave empty to auto-generate a stable
  # secret on first install (reused on upgrade via a cluster lookup). Set
  # explicitly for GitOps/reproducible installs.
  appSecret: ""
  # Read APP_SECRET from a Secret you manage (e.g. one projected from Key Vault
  # by External Secrets) instead of letting this chart own it.
  #
  # REQUIRED under Argo CD / any GitOps renderer: the generate-once path relies
  # on a cluster `lookup`, which is always empty under `helm template`, so the
  # value would be re-minted on every sync and log every user out. Same reasoning
  # as genesis/templates/01-internal-secrets.yaml.
  existingSecret: ""
  existingSecretKey: APP_SECRET
  # Disable Umami's anonymous telemetry to the upstream project by default.
  disableTelemetry: true
  # Extra raw env vars (list of {name, value}) passed to the Umami container.
  extraEnv: []

# ---- Database ---------------------------------------------------------------
# How Umami is pointed at a database depends on authMethod — the two paths read
# DIFFERENT keys, so a field that matters in one is ignored in the other.
#
#   bundled=true          -> short-circuits everything and deploys an in-chart
#                            PostgreSQL. Nothing below is read.
#
#   authMethod=password   -> database.existingSecret (a Secret you manage holding
#                            a DATABASE_URL key), else database.external.url — a
#                            whole connection string, so a plaintext password
#                            never has to live in values.yaml. The structured
#                            host/port/user/sslMode fields are NOT read here, and
#                            omitting `url` is a render error, not a fallback.
#
#   authMethod=           -> database.existingSecret, else the structured
#     managed-identity       host/port/user/name/schema/sslMode fields, each
#                            falling back to the matching global.database value.
#                            `url` is ignored: a connection string is read once
#                            and cannot carry a token that expires hourly.
#
# APP_SECRET is never read from database.existingSecret — see app.existingSecret.
database:
  # true  -> in-chart PostgreSQL StatefulSet (turnkey; local/dev only).
  # false -> use an existing server, which is what customer environments do.
  bundled: true

  # password         -> credentials come from the URL or existingSecret.
  # managed-identity -> no password anywhere: the app requests a short-lived
  #                     Microsoft Entra token per connection. Requires an image
  #                     with Entra support and Workload Identity on the pod.
  #
  # managed-identity means AZURE Entra specifically. The image acquires tokens
  # through DefaultAzureCredential for the Azure PostgreSQL scope, so there is no
  # AWS path: RDS IAM auth is a different mechanism, where the signed token IS
  # the password. On AWS use authMethod=password with database.existingSecret.
  # (The platform makes the same assumption: genesis-lib emits
  # AZURE_USE_MANAGED_IDENTITY for any managed-identity auth without checking
  # global.managedIdentity.provider, so this is not umami-specific.)
  # Empty inherits global.database.authMethod, so an environment that already
  # runs the platform on managed identity gets the same treatment here.
  authMethod: ""

  external:
    # Full connection string. Password auth only — leave empty for MI.
    url: ""
    # Structured fields. Each falls back to the matching global.database value,
    # so in most environments only `name` and `schema` need setting here.
    host: ""                        # "" => global.database.host
    port: 0                         # 0  => global.database.port (default 5432)
    user: ""                        # "" => global.database.username
    name: "umami"                   # the database to connect to
    # Postgres schema to isolate Umami's ~25 tables inside a shared database.
    # Empty uses the connection's default search_path.
    schema: "umami"
    sslMode: ""                     # "" => global.database.sslMode, else "require"

  existingSecret: ""                # Secret holding the connection string
  # Key within that Secret. Configurable so umami can share the platform
  # Secret (ai-studio-secrets) instead of needing one of its own — a shared
  # Secret needs a namespaced key, e.g. UMAMI_DATABASE_URL, because plain
  # DATABASE_URL in a Secret every pod mounts would collide with the next
  # service that wants one. Mirrors app.existingSecretKey.
  existingSecretKey: DATABASE_URL

postgresql:
  image:
    # helm-guard-exempt: upstream Chainguard (Wolfi) Postgres for the optional,
    # default-off bundled DB. Not mirrored to sprintregistry because this chart
    # never renders unless genesis-umami.enabled=true; repoint repository at the
    # org mirror (e.g. sprintregistry.azurecr.io/chainguard/postgres) and clear
    # `digest` when registry policy requires pulling from the internal ACR.
    repository: cgr.dev/chainguard/postgres
    # Chainguard's PUBLIC postgres repo publishes only `latest`/`latest-dev` —
    # there are no versioned tags to pin to, and `latest` currently tracks
    # PostgreSQL 18.x. A floating tag would let a major-version jump land on an
    # existing PVC and refuse to start ("database files are incompatible"), so
    # the digest below pins the exact image. Bump it deliberately (and plan a
    # dump/restore across a major bump). Set digest: "" to follow `tag` instead
    # — e.g. when pulling a versioned tag from the ACR mirror.
    tag: "latest"
    digest: "sha256:cc0ad418b90ee621ad4c258cfc62f8a605bc2a53e105647517d8992b89a12978"
    pullPolicy: IfNotPresent
  # The Chainguard image's postgres account is UID/GID 70 (`postgres:x:70:70`),
  # NOT the Debian-postgres 999 nor the platform's usual 65532. initdb resolves
  # its effective UID against /etc/passwd and hard-fails ("could not look up
  # effective user ID") under any other value, so this is dictated by the
  # upstream image. helm-guard-exempt: third-party image UID.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
  auth:
    username: umami
    # Leave empty: a strong password is generated on first install and stored
    # in the chart Secret (reused on upgrade). No default credential is shipped.
    # Set explicitly only for GitOps/reproducible installs.
    password: ""
    database: umami
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

service:
  type: ClusterIP
  port: 3000

# ---- Path prefix -------------------------------------------------------------
# Where this app is served. MUST match the BASE_PATH the image was BUILT with
# (.azure-pipelines/umami-cicd.yaml) and the prefix the gateway route uses.
#
# This value does not configure the app -- it cannot. Next.js applies basePath
# at build time and the runtime stage of the Dockerfile does not carry the
# variable, so setting it here would silently do nothing. It exists so the
# chart's own health probes, internal URLs and the bridge agree with whatever
# the image was built for. Change the pipeline and this together, or the pod
# fails its readiness probe on a path the app no longer serves.
basePath: "/umami"

# ---- Redis ------------------------------------------------------------------
# REQUIRED for staff dashboard access, not an optimisation.
#
# The login bridge hands the browser a token from Umami's /api/auth/sso, which
# is the only endpoint that mints an EXPIRING one (saveAuth(..., 86400) -- 24h).
# /api/auth/login passes no expiry at all, so its token lives until APP_SECRET
# rotates. And /api/auth/sso returns 500 "Redis is disabled" without REDIS_URL.
#
# So with this off: either the bridge cannot sign anyone in, or every staff
# browser holds a permanent Umami session. Leave it on wherever bridge.enabled.
#
# The URL is COMPOSED from the parts below plus the password from the platform
# secret, rather than taking a whole connection string -- that password already
# exists there for every other Redis client, and a second copy of it embedded in
# a URL is one more thing to rotate in lockstep.
redis:
  enabled: false
  host: "genesis-redis"
  port: 6379
  # node-redis takes user:password. Redis AUTH without an ACL user wants the
  # password only, which is an empty username here.
  username: ""
  tls: true
  # Secret holding the password. Defaults to the same one the staff credentials
  # come from (the platform secret, where REDIS_PASSWORD already lives).
  existingSecret: ""
  passwordSecretKey: "REDIS_PASSWORD"
  caCert:
    # Secret holding `ca.crt` for a privately-issued Redis certificate, mounted
    # and exported as NODE_EXTRA_CA_CERTS. Required whenever tls is true and the
    # server's CA is not a public one -- node-redis verifies against Node's
    # default trust store and will otherwise fail the handshake outright.
    # Leave empty for a publicly-trusted certificate.
    secretName: ""

# ---- Staff access ------------------------------------------------------------
# Umami has no SSO, and its only account out of the box is `admin`, which can
# delete websites and reset their data (ROLE_PERMISSIONS.admin = ["all"]).
# Nobody should be reading a dashboard with that. This provisions a read-only
# identity for the login bridge to sign staff in as.
#
# Two objects, and BOTH are required -- neither works alone:
#   · a user with the global `view-only` role, which removes write permissions
#     but grants no read access at all (ROLE_PERMISSIONS["view-only"] == [])
#   · a team that OWNS the app websites, which is where the read access
#     actually comes from
# The sites must be transferred, not merely associated: canViewWebsite checks
# `entity.userId` first and returns before it ever looks at `entity.teamId`,
# so an admin-owned site is invisible to team members.
staffSetup:
  enabled: true
  # Display name of the team. Looked up by name because POST /api/teams mints
  # its own uuid and accepts no id.
  teamName: "Genesis Staff"
  username: "genesis-platform-staff"
  # Umami role for that account.
  #
  # `admin` by default, so a platform admin arriving through the bridge can do
  # real work: save funnels and retention reports, organise boards, manage
  # teams. Umami offers no role that permits those while withholding site
  # deletion -- every role above "nothing" carries websiteDelete -- so the two
  # destructive calls are blocked at the bridge instead (bridge.blockedCalls).
  #
  # Set to `view-only` for a strictly read-only posture. That account sees
  # nothing on its own, so the team and site-adoption steps below become
  # necessary; with `admin` they are skipped entirely.
  role: "admin"
  # Pin an exact Umami user id. Leave EMPTY -- it is derived from the release
  # name (see umami.staffUserId) so it is stable across renders.
  userId: ""
  # Adopt every admin-owned website into the team on each run. GET /api/websites
  # returns only what the caller owns, so this picks up exactly the sites each
  # app's provisioning container created and nothing else; once transferred they
  # leave that list, which is what makes re-running a no-op.
  adoptWebsites: true
  adminUser: "admin"
  # Defaults to app.existingSecret so these sit beside APP_SECRET rather than
  # adding a third Secret for two keys.
  existingSecret: ""
  adminPasswordSecretKey: "UMAMI_ADMIN_PASSWORD"
  passwordSecretKey: "UMAMI_STAFF_PASSWORD"
  timeout: 120
  # Also emit ArgoCD's PostSync annotations. ArgoCD does not read helm.sh hooks,
  # and dev is continuously synced by ArgoCD, so without this the Job would be
  # treated as an ordinary resource there and never re-run after the first sync.
  argocdHook: true
  ttlSecondsAfterFinished: 600
  # false on purpose: analytics must never be the reason a pod will not start.
  # A failed run leaves the bridge unable to sign anyone in until a later
  # restart succeeds; it does not take Umami down.
  failOnError: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# ---- Keycloak client --------------------------------------------------------
# The client the GATEWAY uses to sign a browser in before it reaches this
# dashboard. Provisioned here, never by hand: a hand-made client exists in one
# environment, is missing from staging and prod, and does not survive a realm
# rebuild. Same posture as genesis-fe, which provisions its own.
#
# Nothing in Umami consumes this. It lives in this chart because the dashboard
# route is what needs it, and this chart already owns everything provisioned
# around that route.
keycloak:
  setup:
    enabled: true
    # In-cluster Keycloak address. The admin API is not published at the edge.
    url: "http://genesis-idp:8080/auth"
    realm: "autonomize"
    clientId: "genesis-umami-dashboard"
    # Must match the gateway route's openid-connect redirect_uri exactly.
    redirectUri: ""
    webOrigin: ""
    # Keys in the platform secret. The client secret is PINNED from there
    # rather than generated by Keycloak, so realm and gateway cannot drift and
    # rotation is a single vault edit.
    adminUserSecretKey: "KC_BOOTSTRAP_ADMIN_USERNAME"
    adminPasswordSecretKey: "KC_BOOTSTRAP_ADMIN_PASSWORD"
    clientSecretKey: "UMAMI_OIDC_CLIENT_SECRET"
    timeout: 120
    # false: a Keycloak blip must not fail the deploy. The next run fixes it;
    # until then the dashboard route cannot complete a login.
    failOnError: false

# ---- Login bridge ------------------------------------------------------------
# The container the gateway routes to. On the bare entry path it mints a
# short-lived Umami session for the read-only account above and redirects to
# Umami's own /sso page; every other path it proxies through untouched.
#
# It is NOT a security boundary -- it trusts the gateway, which is the only way
# to reach it. The platform-admin check happens there, in auth-verify.lua. The
# requiredRole below is defence in depth against a misconfigured route.
#
# Runs from this same image with a different command, so it adds no second
# image to build, tag, or scan.
bridge:
  enabled: true
  port: 3001
  # Must match `requiredRoles` on the gateway's dashboard route.
  requiredRole: "platform-admin"
  # Calls refused outright, whatever the Umami account's role.
  #
  # The account is a Umami admin so staff can actually work in the tool. These
  # two are the exception, and deletion is the one that really matters: the
  # site id is what the tracker posts events to, and it is DERIVED from the
  # environment host plus chart name rather than stored -- so a deleted site is
  # recreated empty under the SAME id on the next deploy. Ingestion silently
  # resumes into a blank site, the dashboard still loads, and history is gone
  # with no error and nothing to restore.
  #
  # Reset is included for the same data-loss reason, though it leaves ingestion
  # intact. Drop it from this list if staff need it.
  #
  # Format: "METHOD:<regex against Umami's own path>". Set to [] to disable.
  blockedCalls:
    - "DELETE:^/api/websites/[^/]+/?$"
    - "POST:^/api/websites/[^/]+/reset/?$"
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: umami.local
  tls: []                          # [{secretName: umami-tls, hosts: [umami.local]}]

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }

# Umami's image runs as its own `nextjs` account — `nextjs:x:1001:65533`, i.e.
# UID 1001 with primary GID 65533 (nogroup), not the platform's 65532. The /app
# tree is owned by that UID/GID, so overriding it breaks startup. Values below
# mirror the image exactly. helm-guard-exempt: third-party image UID; non-root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 65533
  fsGroup: 65533
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
