{{- if .Values.enabled }}
{{- /*
This chart owns APP_SECRET (unless app.existingSecret supplies it) and, for the
bundled DB, POSTGRES_PASSWORD. DATABASE_URL is owned here only when the user did
NOT supply database.existingSecret — in that case the deployment reads it from
there instead, so an external-DB Secret only needs a DATABASE_URL key.

$pw is resolved ONCE here and reused for both DATABASE_URL and POSTGRES_PASSWORD.
Calling umami.postgresPassword twice would generate two different random strings
on a first install (nothing to look up yet), leaving Umami unable to authenticate
against the Postgres it just initialised.

Under managed identity there is no password at all: the URL carries only the
Entra principal, and the token is fetched by the application per connection.
*/}}
{{- $pw := "" -}}
{{- if .Values.database.bundled -}}
{{- $pw = include "umami.postgresPassword" . -}}
{{- end -}}
{{- $ownsAppSecret := not .Values.app.existingSecret -}}
{{- $ownsDatabaseUrl := not .Values.database.existingSecret -}}
{{- if or $ownsAppSecret $ownsDatabaseUrl .Values.database.bundled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "umami.fullname" . }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $ownsAppSecret }}
  APP_SECRET: {{ include "umami.appSecret" . | quote }}
  {{- end }}
  {{- if $ownsDatabaseUrl }}
  DATABASE_URL: {{ include "umami.databaseUrl" (dict "ctx" . "password" $pw) | quote }}
  {{- end }}
  {{- if .Values.database.bundled }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  {{- end }}
{{- end }}
{{- end }}
