{{- if and .Values.enabled .Values.serviceAccount.create }}
{{- /*
Azure Workload Identity projects its federated token onto the pod's
ServiceAccount, and the federated credential registered in Entra names a
specific ServiceAccount + namespace. Running as `default` therefore yields no
identity at all, which is why this exists rather than relying on the namespace
default. Mirrors genesis-lib's annotation contract so the subchart behaves like
every other platform service.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "umami.serviceAccountName" . }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
    app.kubernetes.io/component: umami
  {{- with (include "umami.serviceAccountAnnotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
