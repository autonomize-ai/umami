{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "umami.fullname" . }}
  labels:
    {{- include "umami.labels" . | nindent 4 }}
    app.kubernetes.io/component: umami
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "umami.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: umami
{{- end }}
