{{- if and .Values.enabled .Values.staffSetup.enabled }}
{{- $fullname := include "umami.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-staff-setup
  labels:
    {{- include "umami.labels" . | nindent 4 }}
data:
  staff-setup.sh: |
    #!/bin/sh
    set -e

    # Provision the staff identity the login bridge signs platform admins in as.
    #
    # The account is a Umami ADMIN. canViewWebsite starts with
    # `if (user.isAdmin) return true`, so it can open every organisation's site
    # without being in any team, and Admin -> Websites lists them all. Each
    # site stays in its own org's team: nothing here moves or adopts sites.
    #
    # Idempotent throughout: safe on every pod start, which is when it runs.

    echo "=== Umami staff access setup ==="
    echo "Umami URL: ${UMAMI_URL}"
    echo "Account:   ${STAFF_USER} (role: ${STAFF_ROLE})"

    # -- Step 0: wait for Umami ------------------------------------------
    ELAPSED=0
    echo "Waiting for Umami to become ready..."
    until curl -sf "${UMAMI_URL}/api/heartbeat" > /dev/null 2>&1; do
      if [ "${ELAPSED}" -ge "${TIMEOUT}" ]; then
        echo "WARNING: Umami not reachable after ${TIMEOUT}s."
        # Same posture as the website-provisioning container: analytics must
        # never be the reason a pod will not start. The bridge simply fails to
        # sign anyone in until a later run succeeds.
        [ "${FAIL_ON_ERROR}" = "true" ] && exit 1
        echo "Continuing without staff setup."
        exit 0
      fi
      sleep 5
      ELAPSED=$((ELAPSED + 5))
      echo "Umami not ready yet... (${ELAPSED}s/${TIMEOUT}s)"
    done
    echo "Umami is ready."

    # -- Step 1: admin token ---------------------------------------------
    LOGIN=$(curl -sf -X POST "${UMAMI_URL}/api/auth/login" \
      -H "Content-Type: application/json" \
      -d "{\"username\":\"${UMAMI_ADMIN_USER}\",\"password\":\"${UMAMI_ADMIN_PASSWORD}\"}") || {
      echo "ERROR: admin login failed."
      [ "${FAIL_ON_ERROR}" = "true" ] && exit 1
      exit 0
    }

    TOKEN=$(echo "${LOGIN}" | sed 's/.*"token"[ ]*:[ ]*"\([^"]*\)".*/\1/')
    if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "${LOGIN}" ]; then
      echo "ERROR: could not parse admin token."
      [ "${FAIL_ON_ERROR}" = "true" ] && exit 1
      exit 0
    fi
    echo "Admin token obtained."

    AUTH="Authorization: Bearer ${TOKEN}"

    # -- JSON parsing --------------------------------------------------
    # via node, not sed. Umami's responses are NESTED, and a greedy
    # `sed 's/.*"id":"\([^"]*\)".*/\1/'` takes the LAST match on the line, so it
    # silently returns a nested row's id where the top-level one was wanted.
    #
    # node is already in this image (it IS the umami image), so there is no new
    # dependency and no jq to vendor.
    jsonpath() {
      node -e '
        let raw = "";
        process.stdin.on("data", d => raw += d);
        process.stdin.on("end", () => {
          try {
            const parsed = JSON.parse(raw);
            const rows = Array.isArray(parsed) ? parsed : (parsed.data || []);
            const [mode, arg] = process.argv.slice(1);
            if (mode === "role") {
              process.stdout.write(parsed && parsed.role ? parsed.role : "");
            } else if (mode === "id") {
              process.stdout.write(parsed && parsed.id ? parsed.id : "");
            } else if (mode === "present") {
              process.stdout.write(parsed && parsed.id ? "yes" : "");
            }
          } catch (e) {
            process.stdout.write("");
          }
        });
      ' "$1" "$2"
    }

    # -- Step 2: the staff account -----------------------------------
    # POST /api/users accepts an optional `id`, so this one is deterministic
    # (computed by the chart from the release).
    #
    # A missing user comes back as the literal `null` WITH a 200, exactly like
    # a missing website does -- so the status code alone reports every account
    # as already present and creates nothing. Observed on k3d against an
    # instance whose only user was `admin`.
    USER_PRESENT=$(curl -s "${UMAMI_URL}/api/users/${STAFF_ID}" -H "${AUTH}" | jsonpath present)

    if [ -n "${USER_PRESENT}" ]; then
      # Reconcile the role rather than assuming it: an account left at any
      # other role (created by an older chart, or edited by hand) is put back
      # to admin.
      #
      # The password is reconciled too, but ONLY when it no longer works. It
      # lives in the platform secret, and the bridge authenticates to Umami
      # with it. Rotating that secret without also updating the Umami account
      # would leave the bridge holding a password the account no longer has --
      # so the dashboard breaks on the next login, with nothing in the logs
      # pointing at a vault edit as the cause.
      #
      # Re-sending an UNCHANGED password is not free. Umami re-hashes whatever
      # it is given (bcrypt, fresh salt), and every token carries a fingerprint
      # of the hash it was issued under (src/lib/auth.ts) -- so each re-send
      # signs out every staff browser and the bridge's own service token. This
      # job is a PostSync hook and dev syncs every few minutes, so staff were
      # dropped onto Umami's login page every few minutes. Hence: try the
      # password first, and only write it when the login is refused.
      CURRENT_ROLE=$(curl -s "${UMAMI_URL}/api/users/${STAFF_ID}" -H "${AUTH}" | jsonpath role)
      if [ "${CURRENT_ROLE}" = "${STAFF_ROLE}" ]; then
        echo "Account exists with role ${STAFF_ROLE}."
      else
        echo "Account exists with role ${CURRENT_ROLE:-unknown}; updating to ${STAFF_ROLE}."
        curl -sf -X POST "${UMAMI_URL}/api/users/${STAFF_ID}" \
          -H "${AUTH}" -H "Content-Type: application/json" \
          -d "{\"role\":\"${STAFF_ROLE}\"}" \
          > /dev/null && echo "Role updated." || echo "WARNING: role update failed."
      fi

      STAFF_LOGIN=$(curl -sf -X POST "${UMAMI_URL}/api/auth/login" \
        -H "Content-Type: application/json" \
        -d "{\"username\":\"${STAFF_USER}\",\"password\":\"${STAFF_PASSWORD}\"}") || STAFF_LOGIN=""
      STAFF_TOKEN=$(echo "${STAFF_LOGIN}" | sed -n 's/.*"token"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
      if [ -n "${STAFF_TOKEN}" ]; then
        # /api/auth/login sessions never expire, so drop the one this check
        # just created rather than leave one behind on every sync.
        curl -s -X POST "${UMAMI_URL}/api/auth/logout" \
          -H "Authorization: Bearer ${STAFF_TOKEN}" > /dev/null || true
        echo "Password already current; left unchanged."
      else
        echo "Password refused (rotated in the secret?); updating it."
        curl -sf -X POST "${UMAMI_URL}/api/users/${STAFF_ID}" \
          -H "${AUTH}" -H "Content-Type: application/json" \
          -d "{\"password\":\"${STAFF_PASSWORD}\"}" \
          > /dev/null && echo "Password updated." || echo "WARNING: password update failed."
      fi
    else
      echo "Creating staff account (role: ${STAFF_ROLE})..."
      # Role comes from values. Default is `admin`, so a platform admin signing
      # in through the bridge can save reports, organise boards and manage
      # teams -- Umami has no role granting those while withholding site
      # deletion, since every role above "nothing" carries websiteDelete.
      # Deletion is blocked at the bridge instead.
      curl -sf -X POST "${UMAMI_URL}/api/users" \
        -H "${AUTH}" -H "Content-Type: application/json" \
        -d "{\"id\":\"${STAFF_ID}\",\"username\":\"${STAFF_USER}\",\"password\":\"${STAFF_PASSWORD}\",\"role\":\"${STAFF_ROLE}\"}" \
        > /dev/null && echo "Created." || echo "WARNING: create failed."
    fi

    # The admin login above is a non-expiring session too; drop it so a job
    # that runs on every sync does not accumulate them.
    curl -s -X POST "${UMAMI_URL}/api/auth/logout" -H "${AUTH}" > /dev/null || true

    echo "=== Umami staff access setup complete ==="
    exit 0
{{- end }}
