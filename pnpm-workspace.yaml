packages:
  - '**'
  - '!dist'
  - '!**/dist/**'
# deepmerge-ts is pulled in transitively by @prisma/config, which pins it
# exactly to 7.1.5 - the version CVE-2026-40345 / GHSA-ggr8-5vv4-36mx is filed
# against. The pin is still exact in @prisma/config 7.10.0, so no prisma upgrade
# reaches a patched release and an override is the only route to one.
#
# mysql2 3.15.3 carries GHSA-3f6p-5ww8-9rcr (high, auth plugin downgrade leaks
# plaintext credentials, fixed in 3.22.0) and GHSA-rgwj-5xj2-c3m3 (moderate,
# unbounded zlib inflate in the compressed protocol handler, fixed in 3.23.1).
# prisma depends on mysql2 and pins it exactly to 3.15.3 - still exact in
# 7.10.0 - so no prisma 7.x release reaches a patched version and an override
# is the only route to one. Nothing here loads it: the datasource is postgresql
# through @prisma/adapter-pg, and mysql2 only ships because the prisma package
# depends on it unconditionally.
#
# sharp 0.35.3 carries GHSA-rgj7-g3m4-5g8c (high, the bundled libheif), fixed
# in 0.35.4. next declares sharp as an optional dependency at ^0.35.3, so
# 0.35.4 already sits inside the range it asks for; the override only holds the
# lockfile there so the patched build cannot drift back. 0.35.4 in turn carries
# GHSA-wq5f-xc86-pv6w (high), fixed in 0.35.5.
# caniuse-lite / electron-to-chromium are browserslist-database packages next
# pulls in as loose transitive ranges, unrelated to the CVE-2026-94545 next fix
# in this change. pnpm 11's minimumReleaseAge (24h) rejects whatever happens to
# be newest at build time, and since this org's own database updates multiple
# times a day, "just re-resolve" keeps landing on another too-fresh release.
# Pinned to versions already months old so the build stops racing the policy;
# bump these independently whenever, they carry no security fix themselves.
#
# The block after electron-to-chromium clears the Wiz Vulnerability PR check on
# pnpm-lock.yaml (1 critical, 41 high). Each is held on the major line already
# installed. All are build/test tooling except d3-color: react-simple-maps
# (the world map) reaches it through d3-zoom/d3-interpolate 2, which accept
# '1 - 2'. 3.x is the only fixed line; its API is unchanged, it is ESM-only.
#
# @azure/msal-node 5.x carries GHSA-xcx6-jx8p-x3h5 / CVE-2026-109461 (high,
# authorization code flow may disclose parameters), fixed only in 7.1.0 - no 5.x
# or 6.x backport. @azure/identity reaches it (4.13.x asks for ^5, 4.14.0 for
# ^6) and no identity release accepts 7.x yet, so an override is the only route.
# The 6.0 and 7.0 breaking changes are confined to acquireTokenInteractive and
# its loopback client; umami only calls DefaultAzureCredential().getToken() for
# the Postgres AAD token (src/lib/azure-db.ts, scripts/azure-db.js), which never
# takes the interactive path. The Dockerfile runner stage repeats this override.
overrides:
  '@azure/msal-node': '>=7.1.0 <8'
  deepmerge-ts: '^8.0.2'
  mysql2: '^3.23.1'
  sharp: '^0.35.5'
  caniuse-lite: '1.0.30001806'
  electron-to-chromium: '1.5.397'
  brace-expansion@1: '>=1.1.20 <2'
  brace-expansion@2: '>=2.1.6 <3'
  browserslist: '>=4.28.7 <5'
  d3-color@2: '3.1.0'
  fast-uri: '>=3.1.7 <4'
  js-yaml: '>=4.3.2 <5'
  minimatch@3: '>=3.1.4 <4'
  minimatch@5: '>=5.1.8 <6'
  minimatch@9: '>=9.0.7 <10'
  nanoid@3: '>=3.3.18 <4'
  picomatch@4: '>=4.0.4 <5'
  shell-quote: '>=1.9.0 <2'
  source-map-js: '>=1.2.2 <2'
  svgo@3: '>=3.3.5 <4'
  undici@8: '>=8.10.2 <9'
  vite: '~8.0.16'
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  esbuild: false
  msw: false
  prisma: true
  sharp: false
minimumReleaseAgeExclude:
  - '@umami/react-zen'
