# Umami (Microsoft Entra fork) — image CI/CD
#
# Builds the patched Umami image and publishes it to the platform ACR as
# `genesis-umami`, following the platform's third-party convention documented in
# genesis-v3-charts/docs/SECURITY_OPENCOST.md §1 (container image = chart name),
# the same shape as keycloak-custom -> genesis-idp and temporal -> genesis-de.
#
# The Helm chart lives in this repo, at helmcharts/genesis-umami — a chart lives
# with the source when we own that source, the same shape as
# genesis-openfga/helmcharts, keycloak-custom/helmcharts and temporal/helmcharts.
# Charts for software we do NOT fork (keda, opencost, external-secrets,
# observability) stay in the umbrella as file:// subcharts, having no repo of
# their own.
#
# One run therefore produces three things: the image, the chart (both stamped
# with the same build number), and a bump of the umbrella's pinned chart version
# in genesis-v3-charts.
#
# This branch is cut from upstream tag v3.3.0; UPSTREAM_VERSION below must be
# kept in step with whatever tag the branch is rebased onto.

resources:
  repositories:
    - repository: genesis-v3-charts
      type: github
      endpoint: autonomize-ai
      name: autonomize-ai/genesis-v3-charts
      # `develop` is where service CI auto-bumps land, per that repo's
      # RELEASE_CADENCE.md ("genesis-v3-charts/develop is populated by service
      # CI's [skip ci] auto-bumps"). Deliberately not the chart's feature
      # branch: that gets deleted when it merges, which would leave this ref
      # dangling. The umbrella's genesis-umami dependency is on develop, so this
      # is the ref UpdateUmbrella reads and writes.
      ref: develop

variables:
  # Upstream release this fork is based on. The build number is derived from it
  # so a platform tag is always traceable to an upstream version.
  UPSTREAM_VERSION: '3.3.0'

  # Auto-bump of the umbrella's pinned genesis-umami chart version in
  # genesis-v3-charts.
  #
  # Enabled: both preconditions this waited on are met. The chart sets
  # image.repository: genesis-umami (helmcharts/genesis-umami/values.yaml), and
  # the umbrella takes the chart from oci://platformhelm.azurecr.io/helm rather
  # than an in-tree file:// subchart, so a version written there now takes
  # effect. While either was untrue a bump would have been silent or wrong,
  # which is what kept this 'false'.
  #
  # Set it back to 'false' to stop the pipeline writing to genesis-v3-charts at
  # all; the image and chart still publish. That is a quiet, deliberate skip,
  # unlike 'enabled but the umbrella looks wrong', which the repository guard in
  # templates/release-template.yml fails loudly on.
  ENABLE_CHART_BUMP: 'true'
  patch: $[counter(variables['Build.SourceBranchName'], 0)]
  globalPatch: $[counter('umamiGlobalPatch', 0)]

  # Container Registry Configuration
  ACR_RESOURCE_GROUP: sprintRG
  AZURE_CONTAINER_REGISTRY: sprintregistry
  ACR_ENDPOINT: 'sprintregistry.azurecr.io'

  # Image = chart name, per the platform third-party convention.
  IMAGE_NAME: 'genesis-umami'
  # Chart registry. Deliberately a DIFFERENT registry from the image:
  # genesis-v3-charts/CLAUDE.md — platformhelm is Helm charts ONLY,
  # sprintregistry is container images ONLY.
  HELM_ACR_NAME: platformhelm
  HELM_SERVICE_CONNECTION_NAME: platform-dev-1007
  CONTAINER_NAME: 'genesis-umami'
  DOCKERFILE_PATH: 'Dockerfile'
  # Path prefix this app is served under. Must equal the gateway route prefix
  # in genesis-v3-charts (env-values/values-*.yaml, umami-* routes). Build-time
  # only -- see the BUILD_ARGS note in the Build stage below.
  BASE_PATH: '/umami'

trigger:
  branches:
    include:
      # `develop` only. It is cut from tag v3.3.0 and is the default branch and
      # permanent home of the Entra patch. `master` still tracks upstream past
      # v3.3.0 and carries NO Entra patch, so building it would publish an image
      # tagged `-mi` that cannot do managed-identity auth at all.
      - develop
  paths:
    include:
      - src/**
      - scripts/**
      - bridge/**
      - prisma/**
      - package.json
      - pnpm-lock.yaml
      - Dockerfile
      - helmcharts/**
      - .azure-pipelines/**

pr: none

stages:
  - stage: Version
    displayName: 'Versioning'
    condition: ne(variables['Build.Reason'], 'PullRequest')
    jobs:
      - template: templates/version.yml

  - stage: Build
    displayName: 'Build Umami (Entra) Image'
    dependsOn: Version
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - template: templates/umami-build-template.yml
        parameters:
          jobCondition: succeeded()
          CONTAINER_NAME: $(IMAGE_NAME)
          DOCKERFILE_PATH: $(DOCKERFILE_PATH)
          AZURE_CONTAINER_REGISTRY: $(AZURE_CONTAINER_REGISTRY)
          # BASE_PATH is baked at BUILD time, not read at runtime.
          #
          # next.config.ts reads process.env.BASE_PATH when `next build` runs
          # and Next.js stamps it into every generated asset URL and router
          # link; the runtime stage of the Dockerfile does not carry the var at
          # all. Setting it through the chart's env would silently do nothing.
          #
          # The platform serves this app at genesis.<env>/umami, so the gateway
          # route must NOT rewrite the prefix away -- the app now expects to see
          # it. That makes this line and the umami-ingest route's proxy-rewrite
          # a matched pair, and NEITHER order is safe on its own:
          #
          #   * drop the rewrite first  -> /umami/script.js reaches an image that
          #     still serves at the root, and event collection 404s until this
          #     image lands;
          #   * land this image first   -> the app serves /umami/script.js while
          #     the gateway is still rewriting it to /script.js, and event
          #     collection 404s until the umbrella drops the rewrite.
          #
          # So they have to land together. UpdateUmbrella below writes the new
          # chart version into genesis-v3-charts; the rewrite must come out of
          # env-values in that same commit, so one Argo sync carries both.
          BUILD_ARGS: '--build-arg BASE_PATH=$(BASE_PATH)'

  # Runs in PARALLEL with Build: both depend only on Version and both use the
  # same $(Build.BuildNumber), so the chart can stamp the image tag itself
  # instead of waiting. Same fan-out as genesis-openfga.
  - stage: PublishChart
    displayName: 'Publish genesis-umami chart to OCI'
    dependsOn: Version
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - template: templates/helmpublish.yml
        parameters:
          CHART_NAME: genesis-umami

  # Fan-in: the umbrella may only be pointed at a chart version once BOTH the
  # image and the chart exist in their registries.
  #
  # Gated by ENABLE_CHART_BUMP, now 'true': the umbrella takes genesis-umami from
  # oci://platformhelm.azurecr.io/helm, so the version written here is the one it
  # deploys. release-template.yml re-checks that repository and refuses to run
  # rather than write a version that would have no effect.
  - stage: UpdateUmbrella
    displayName: 'Bump chart version in genesis-v3-charts'
    dependsOn:
      - Build
      - PublishChart
    condition: >-
      and(succeeded(),
          eq(variables['ENABLE_CHART_BUMP'], 'true'),
          eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - template: templates/release-template.yml
