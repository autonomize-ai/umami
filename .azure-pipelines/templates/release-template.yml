# Bump the genesis-umami chart version in genesis-v3-charts.
#
# Runs only after BOTH the image and the chart have published, because the
# umbrella must never point at a chart version that does not exist in the
# registry — the ordering rule in genesis-v3-charts/docs/SECURITY_OPENCOST.md,
# whose reverse once put genesis-develop into ImagePullBackOff for ~5h.
#
# Note what this does NOT do any more: it used to write image.tag into
# genesis/charts/umami/values.yaml. The chart now lives in THIS repo, so the
# image tag is stamped by helmpublish.yml at package time and the umbrella
# carries only a pinned chart version.
jobs:
  - job: UpdateUmbrellaChart
    displayName: "Bump genesis-umami version in the umbrella"
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: genesis-v3-charts
        fetchDepth: 0
        persistCredentials: true

      - script: |
          git config --global user.email "release@autonomize.ai"
          git config --global user.name "release"
          git checkout develop
        displayName: 'Setup GIT'

      - script: |
          set -e
          wget -q https://github.com/mikefarah/yq/releases/download/v4.42.1/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
        displayName: 'Install yq'

      - script: |
          set -e
          # Guard: while the umbrella still vendors the chart as a file://
          # subchart, bumping a version here would be meaningless — the local
          # directory is used regardless. Refuse rather than write a value that
          # silently has no effect.
          repo=$(yq e '(.dependencies[] | select(.name == "genesis-umami")).repository' genesis/Chart.yaml)
          if [ "$repo" != "oci://platformhelm.azurecr.io/helm" ]; then
            echo "ERROR: genesis-umami dependency repository is '$repo'."
            echo "Expected oci://platformhelm.azurecr.io/helm. The umbrella has not"
            echo "been switched off the in-tree file:// subchart yet."
            exit 1
          fi

          echo "Updating genesis-umami chart version -> $(Build.BuildNumber)"
          buildnumber="$(Build.BuildNumber)" yq -i e \
            '(.dependencies[] | select(.name == "genesis-umami")).version = env(buildnumber)' \
            genesis/Chart.yaml
          git --no-pager diff -- genesis/Chart.yaml
        displayName: 'Update chart version in genesis/Chart.yaml'

      - task: AzureCLI@2
        displayName: 'Regenerate umbrella Chart.lock'
        inputs:
          azureSubscription: $(HELM_SERVICE_CONNECTION_NAME)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -e
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            TOKEN=$(az acr login -n $(HELM_ACR_NAME) --expose-token --query accessToken -o tsv)
            helm registry login $(HELM_ACR_NAME).azurecr.io \
              --username 00000000-0000-0000-0000-000000000000 --password "$TOKEN"
            # Chart.lock must match Chart.yaml or `helm upgrade` on the umbrella
            # fails outright.
            helm dependency update genesis/

      - script: |
          set -e
          git add genesis/Chart.yaml genesis/Chart.lock
          git commit -m "[skip ci] genesis-umami chart version updated: $(Build.BuildNumber)"
          git push --set-upstream origin develop
        displayName: 'Push to genesis-v3-charts'
