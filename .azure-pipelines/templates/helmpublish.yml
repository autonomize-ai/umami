# Package the genesis-umami chart and push it to the platform OCI registry.
#
# Runs in PARALLEL with the image build: both stages depend only on Version, and
# both use the same $(Build.BuildNumber). That is what makes the fan-out possible
# — this stage stamps the image tag into values.yaml itself rather than waiting
# for the image stage to report it, exactly as genesis-openfga does.
#
# One number therefore identifies both artifacts of a run:
#   image  sprintregistry.azurecr.io/genesis-umami:<BuildNumber>
#   chart  platformhelm.azurecr.io/helm/genesis-umami:<BuildNumber>
#
# The chart lives in this repo, not genesis-v3-charts, because this repo owns the
# source it wraps — same as genesis-openfga/helmcharts, keycloak-custom/helmcharts
# and temporal/helmcharts. Charts for software we do NOT fork (keda, opencost,
# external-secrets) stay in the umbrella as file:// subcharts, having no repo of
# their own.
parameters:
  - name: CHART_NAME
    type: string
    default: genesis-umami

jobs:
  - job: Publish_${{ replace(parameters.CHART_NAME, '-', '_') }}
    displayName: "Package and Push ${{ parameters.CHART_NAME }}"
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self

      - script: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.7.2 2>/dev/null || true
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xzf - -C /usr/local/bin/ kubeconform
          wget -q https://github.com/mikefarah/yq/releases/download/v4.42.1/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
        displayName: Install Helm + test tools

      - task: AzureCLI@2
        displayName: "Lint, test, package, and push ${{ parameters.CHART_NAME }}"
        inputs:
          azureSubscription: "platform-dev-1007"
          scriptType: "bash"
          scriptLocation: "inlineScript"
          inlineScript: |
            set -e
            CHART_DIR="helmcharts/${{ parameters.CHART_NAME }}"

            az acr login -n $(HELM_ACR_NAME)

            echo "=== Helm lint ==="
            # enabled=true because every template is gated on it; linting the
            # default-off state would validate nothing.
            helm lint "$CHART_DIR" --set enabled=true

            echo "=== Template render + kubeconform ==="
            # Rendered twice: the bundled-Postgres path and the external-DB path.
            # They emit disjoint resource sets (StatefulSet vs none, chart-owned
            # Secret vs none), so one render cannot cover both.
            helm template test-release "$CHART_DIR" --set enabled=true \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas
            helm template test-release "$CHART_DIR" --set enabled=true \
              --set database.bundled=false \
              --set database.existingSecret=test-secret \
              --set app.existingSecret=test-secret \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas

            echo "=== Helm unittest ==="
            helm unittest "$CHART_DIR"

            # The chart must ship pointing at the image THIS run builds. Both
            # derive from the same Build.BuildNumber, so this needs no
            # coordination with the image stage — which is why the two run in
            # parallel. Written into the package only; not committed back.
            echo "=== Stamping image.tag = $(Build.BuildNumber) ==="
            buildnumber="$(Build.BuildNumber)" yq -i e '.image.tag = env(buildnumber)' "$CHART_DIR/values.yaml"
            yq e '.image.repository, .image.tag' "$CHART_DIR/values.yaml"

            echo "=== Packaging ==="
            helm package "$CHART_DIR" --version "$(Build.BuildNumber)"

            echo "=== Pushing to OCI ==="
            helm push ${{ parameters.CHART_NAME }}-$(Build.BuildNumber).tgz \
              oci://$(HELM_ACR_NAME).azurecr.io/helm
            echo "Published: $(HELM_ACR_NAME).azurecr.io/helm/${{ parameters.CHART_NAME }}:$(Build.BuildNumber)"
