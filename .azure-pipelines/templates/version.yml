# Build number = the platform image tag.
#
# Shape: <upstream>-mi.<counter> on the release branch, e.g. 3.3.0-mi.7
#        <upstream>-mi-<branch>.<counter>-<sha> elsewhere
#
# The `-mi` marker is load-bearing: a bare 3.3.N would be indistinguishable from
# an upstream Umami release, and this image is NOT upstream — it carries the
# Microsoft Entra patch. Both shapes are valid Docker tags.
jobs:
  - job: Create_version
    steps:
      - bash: |
          raw_branchname="$(Build.SourceBranch)"
          cleaned_string="${raw_branchname#refs/heads/}"
          branchname="${cleaned_string//\//-}"
          commit_hash="${BUILD_SOURCEVERSION:0:8}"

          if [[ "$branchname" == "feat-azure-managed-identity" ]]
          then
            echo "##vso[build.updatebuildnumber]$(UPSTREAM_VERSION)-mi.$(globalPatch)"
          else
            echo "##vso[build.updatebuildnumber]$(UPSTREAM_VERSION)-mi-$branchname.$(patch)-${commit_hash}"
          fi
        condition: ne(variables['Build.Reason'], 'PullRequest')
        name: SetBranchBuildName
